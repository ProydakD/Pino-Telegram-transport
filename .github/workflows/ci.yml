name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Quality / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Test proxy routes against the built package
        run: npm run test:proxy

      - name: Test public types with ES5 target
        run: npm run test:types

      - name: Set up early Node 18 for proxy regressions
        if: matrix.node == '24'
        uses: actions/setup-node@v4
        with:
          node-version: '18.12.1'

      - name: Test proxy DNS, debug logging and uploads on Node 18.12.1
        if: matrix.node == '24'
        run: node tests/proxy/legacy-runtime.cjs

      - name: Set up minimum supported Node
        if: matrix.node == '24'
        uses: actions/setup-node@v4
        with:
          node-version: '18.0.0'

      - name: Test CONNECT errors on Node 18.0.0
        if: matrix.node == '24'
        run: node tests/proxy/legacy-connect.cjs

      - name: Set up Node with the fetch signal regression
        if: matrix.node == '24'
        uses: actions/setup-node@v4
        with:
          node-version: '18.16.0'

      - name: Test direct heap, cancellation and uploads on Node 18.16.0
        if: matrix.node == '24'
        env:
          NODE_EXTRA_CA_CERTS: tests/proxy/localhost-cert.pem
          TELEGRAM_BOT_TOKEN: '0:fixture'
        run: |
          node --expose-gc tests/proxy/legacy-heap.cjs
          node tests/proxy/legacy-transport.cjs no-timeout
          node tests/proxy/legacy-multipart.cjs --direct

  compat:
    name: Compat / Node ${{ matrix.node }} / pino@${{ matrix.pino }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '24']
        pino: ['9', '10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run supported compatibility check
        if: ${{ !(matrix.node == '18' && matrix.pino == '10') }}
        run: npm run test:compat:pino${{ matrix.pino }}

      - name: Verify Node 18 rejects pino@10 compat check
        if: ${{ matrix.node == '18' && matrix.pino == '10' }}
        shell: bash
        run: |
          if npm run test:compat:pino10; then
            echo "Expected Node.js 18 + pino@10 compatibility check to fail."
            exit 1
          fi
